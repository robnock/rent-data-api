# Run Alembic migrations against production Postgres (manual trigger).
# Add repo secret DATABASE_URL (postgresql+psycopg://...) in GitHub Settings → Secrets.

name: Prod database migrate

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Alembic upgrade
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: PYTHONPATH=api python -m alembic upgrade head
