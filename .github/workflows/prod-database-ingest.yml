# Full warehouse ingest from repo data/ → production Postgres (manual trigger).
# Add repo secret DATABASE_URL. Large CSVs may approach Actions time limits.

name: Prod database ingest

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: PYTHONPATH=api python -m ingest
